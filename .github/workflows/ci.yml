name: CI

# Runs on every push to main and on every PR against it. `verify` is the gate
# AGENTS.md section 10 asks for; the other jobs exist because `verify` cannot see
# three classes of failure that this repo has already hit:
#
#   - a token pipeline that drifted from tokens.json      -> covered by check:tokens
#   - a page assertion that outlived the page it described -> covered by e2e only
#   - a schema that parses but will not apply              -> covered by the database job
#
# `test:e2e` is deliberately absent from the `verify` chain (it builds and boots a
# server, so it belongs in its own job), which is exactly why a stale 404
# assertion for /pricing survived a page being built in its place.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: this workflow reads the repo and nothing else.
permissions:
  contents: read

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Prisma resolves the datasource from this at generate/validate time and will
  # not run at all without it, even though nothing here connects. The database
  # job overrides it with the service container's address.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ehems?schema=public
  AUTH_SESSION_SECRET: ci-only-not-a-real-session-secret-0000000000
  APP_BASE_URL: https://ehems.example.invalid

jobs:
  verify:
    name: verify (tokens, types, lint, format, unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # LTS. Local development is on 24, which is also supported; 22 is used
          # here because it is the more conservative choice for a pipeline.
          node-version: '22'
          cache: npm

      - run: npm ci

      # Must precede typecheck: a fresh `npm ci` leaves @prisma/client ungenerated,
      # and every prisma.* call site fails to type without it.
      - run: npm run db:generate

      - run: npm run verify

  schema:
    name: schema (valid, and can produce SQL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails on a malformed schema, a missing relation, or a bad field reference.
      - run: npx prisma validate

      # Stronger than validate: renders the schema to DDL, so a construct Prisma
      # accepts but cannot emit is caught here rather than at deploy time. The
      # output is discarded - this asserts it can be generated, not what it says.
      # `--to-schema-datamodel` is the spelling Prisma 6.19 accepts; the shorter
      # `--to-schema` is a Prisma 7 form and errors here.
      - name: Render schema to DDL
        run: npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /dev/null

  database:
    name: database (schema applies, seed loads)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ehems
        ports:
          - 5432:5432
        # Do not start testing until Postgres actually accepts connections, or
        # the first Prisma call fails against a socket that is not listening yet.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ehems?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Must precede the seed. `migrate deploy` applies SQL but does not generate
      # the client the way `db push` did, and a fresh `npm ci` leaves
      # @prisma/client ungenerated, so the seed would fail to import it.
      - run: npm run db:generate

      # `migrate deploy`, not `migrate dev`: this is the production path, and
      # `dev` would create a shadow database and want to prompt. It applies the
      # committed migration history exactly as written, including the hand-appended
      # SEC-015 trigger block, which `db push` would have silently ignored.
      - name: Apply migrations
        run: npx prisma migrate deploy

      # The seed is a contract - it is what the client sees on first login. It
      # also imports CONSENT_VERSION from lib/ndpa/consent, so running it proves
      # that constant and the schema have not drifted apart.
      #
      # The -P flag points ts-node at a CommonJS tsconfig. The old command-line
      # override only parsed on shells that strip single quotes, so the seed
      # failed outright on Windows while passing on ubuntu.
      - name: Load seed
        run: npm run db:seed

      # Idempotency: the seed upserts, so a second run must not fail or duplicate.
      # This is the hard gate - a duplicate key or constraint violation here means
      # the first run wrote real rows and the seed is safe to re-run.
      - name: Re-run seed to prove idempotency
        run: npm run db:seed

      - name: Assert the seed actually wrote data
        run: npx prisma db execute --file scripts/verify-seed.sql --schema prisma/schema.prisma

      # The login/reset throttles share an atomic PostgreSQL bucket across app
      # instances; prove concurrent attempts cannot exceed the configured limit.
      - name: Verify shared auth rate limiting
        run: npx ts-node -P prisma/tsconfig.seed.json scripts/verify-auth-rate-limit.ts

      # The audit_log protections are hand-appended SQL that Prisma cannot see, so
      # nothing else would notice if they were lost. This asserts INSERT is
      # permitted and UPDATE, DELETE and TRUNCATE are all refused.
      - name: Assert audit_log is append-only (SEC-015)
        run: npx prisma db execute --file scripts/verify-audit-trigger.sql --schema prisma/schema.prisma

      # The NDPA data subject request workflow against a real database: the state
      # machine, the handled_by attribution, the audit entries, and the two
      # refusals the compliance story depends on (no reopening a closed request,
      # no hard-deleting a member who has audit history).
      #
      # `test:app` deliberately excludes these - it has to run with no database -
      # so they live in a `*.db.test.ts` file and are opted back in by
      # vitest.db.config.ts.
      - name: Verify data subject request workflow (SEC-013)
        run: npm run test:db

  e2e:
    name: e2e (playwright, 375px + desktop)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ehems
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ehems?schema=public
      AUTH_SESSION_SECRET: e2e-only-not-a-real-session-secret-0000000000
      APP_BASE_URL: http://127.0.0.1:3000
      PAYMENT_PROOF_ENCRYPTION_KEY: l5GEdWwpU2geAYkXCtv7eok7D0IfgbBDMlhlQIPKjPA=
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run db:generate

      - run: npx prisma migrate deploy
      - run: npm run db:seed

      # Both configured projects are Chromium (Pixel 5 emulation and Desktop
      # Chrome), so the Chromium download is sufficient. --with-deps installs the
      # shared libraries a bare runner is missing.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # The config builds and boots its own server. Never point this at a
      # `next dev` server: dev serves unminified bundles, so the bandwidth
      # assertion would be measuring the wrong thing.
      #
      # `--reporter=list,html` overrides the config's bare `list`. Without the
      # html reporter there is no playwright-report/ to upload on failure, so the
      # artifact step below would find nothing to attach.
      - run: npm run test:e2e -- --reporter=list,html

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
